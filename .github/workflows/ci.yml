name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies
        # Fail on known-vulnerable transitive deps with high/critical
        # severity. `--omit=dev` would miss dev-only deps that ship
        # in CI; we want everything.
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # Optional job — skipped if Playwright browsers can't be installed
    # (e.g. self-hosted runner without sudo). Use `workflow_dispatch`
    # to force-run when needed. Required to pass before merging any
    # change to the e2e specs themselves.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /

      - name: End-to-end tests
        run: npm run test:e2e