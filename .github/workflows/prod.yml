name: Build & Deploy (prod)

on:
# Trigger on push to main, but ONLY when src/sw.ts (the service worker)
  # is modified. This prevents accidental deploys on README edits, comment
  # changes, refactors of unrelated files, etc.
  #
  # The Service Worker is the single most deployment-sensitive file: any
  # change to caching strategy, offline behaviour, notification handlers,
  # or scope handling must be validated in production.
  #
  # NOTE: we cannot trigger on push to prod directly, because peaceiris/
  # actions-gh-pages refuses to publish from prod to prod. workflow_dispatch
  # is also available for manual deploys.
  push:
    branches: [main]
    paths:
      - 'src/sw.ts'
    paths-ignore:
      - 'dist/**'
      - 'assets/**'
      - 'icons/**'
      - 'locales/**'
      - 'sw.js'
      - 'sw.js.map'
      - 'manifest.webmanifest'
      - 'index.html'
      - 'mockServiceWorker.js'
      - '*.png'
      - '*.svg'
      - '*.webp'
      - '*.ico'
      - '.nojekyll'
      - 'CNAME'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    # Defense-in-depth: refuse to run when the commit was made by the bot
    # itself. Manual workflow_dispatch always passes (actor is the human who
    # clicked Run).
    if: github.actor != 'github-actions[bot]'
    steps:
      # Always read the source from main. The workflow builds the source
      # currently on main and writes the compiled output into the prod branch,
      # regardless of which branch triggered the run.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build (production)
        env:
          VITE_BASE_PATH: /portami/
        run: npm run build

      # The build regenerates dist/sw.js with the precache manifest injected.
      # These checks catch missing/empty SW before deploying a broken PWA.
      - name: Verify service worker was generated
        run: |
          test -s dist/sw.js || (echo "::error::dist/sw.js is missing or empty" && exit 1)
          echo "sw.js size: $(stat -c%s dist/sw.js) bytes"

      - name: Verify precache manifest was injected
        run: |
          # Workbox injects precache entries with revision hashes like "revision":"<md5>"
          REVS=$(grep -oE '"revision":"[a-f0-9]{32}"' dist/sw.js | wc -l)
          echo "Precache entries with revision: $REVS"
          test "$REVS" -ge 5 || (echo "::error::Expected at least 5 precache entries with revisions" && exit 1)

      - name: Verify manifest uses configured base path
        run: |
          START_URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/manifest.webmanifest','utf8')).start_url)")
          ICON_SRC=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/manifest.webmanifest','utf8')).icons[0].src)")
          echo "start_url: $START_URL"
          echo "icon src: $ICON_SRC"
          test "$START_URL" = "/portami/" || (echo "::error::manifest.start_url is not /portami/" && exit 1)
          case "$ICON_SRC" in
            /portami/icons/*) ;;
            *) echo "::error::manifest icon src must start with /portami/icons/" && exit 1 ;;
          esac

      # Publish the built dist/ into the prod branch itself, replacing its
      # previous contents. After this step, prod holds only the compiled site
      # (assets/, index.html, sw.js, manifest.webmanifest, ...).
      #
      # GitHub Pages must be configured with Source = "Deploy from a branch",
      # Branch = "prod", folder = "/(root)". Then the PWA is served at
      # https://<user>.github.io/portami/.
      #
      # Publishing again: from main, just push to prod again (the workflow
      # rebuilds from main and overwrites prod's artifacts each time).
      - name: Publish to prod branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: prod
          keep_files: false
          disable_nojekyll: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'